name: kidtime

# Every container's log is capped and rotated. A household server is left running for months and
# nobody watches its disk, so an unbounded json-file driver - which is the Docker default - is one
# busy week away from filling it.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: kidtime
      POSTGRES_USER: kidtime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/initialize-server.sh on the Docker host first}
    # What PostgreSQL says about itself, chosen so the log is worth reading rather than complete.
    # Statements are never logged wholesale: that is the database's own copy of every rule and
    # every parent's e-mail, written to disk in a file nothing else protects. What is logged is a
    # statement that took too long, and even then with its bind parameters suppressed
    # (log_parameter_max_length=0) - the shape of a slow query is what gets it fixed, and its
    # values are the household's data.
    command:
      - postgres
      - -c
      - "log_line_prefix=%m [%p] %q%u@%d "
      - -c
      - log_min_duration_statement=${KIDTIME_PG_SLOW_QUERY_MS:-500}
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_checkpoints=on
      - -c
      - log_lock_waits=on
      - -c
      - log_temp_files=1024
      - -c
      - log_autovacuum_min_duration=10s
      - -c
      - log_error_verbosity=default
    volumes:
      - kidtime-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kidtime -d kidtime"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: src/KidTime.Server/Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Logging__Format is 'pretty' (aligned columns, what docker compose logs is read with) or
      # 'json' (whole structured events for a collector). Logging__Colors is auto|always|never;
      # auto sees a pipe in a container and gives up, so the compose default asks for colour.
      Logging__Format: ${KIDTIME_LOG_FORMAT:-pretty}
      Logging__Colors: ${KIDTIME_LOG_COLOR:-always}
      Logging__LogLevel__Default: ${KIDTIME_LOG_LEVEL:-Information}
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_HTTPS_PORTS: "8443"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/kidtime.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${KIDTIME_CERT_PASSWORD:?Run scripts/initialize-server.sh on the Docker host first}
      ConnectionStrings__KidTime: Host=postgres;Port=5432;Database=kidtime;Username=kidtime;Password=${POSTGRES_PASSWORD}
      Jwt__SigningKey: ${KIDTIME_JWT_KEY:?Run scripts/initialize-server.sh on the Docker host first}
      Admin__Email: ${KIDTIME_ADMIN_EMAIL}
      Admin__Password: ${KIDTIME_ADMIN_PASSWORD}
      AgentEnrollment__PublicUrl: ${KIDTIME_AGENT_URL:-}
      # Optional. Points the server at a Technitium DNS Companion so the panel can hand the
      # parent over to it and the child's PC can show what the home network filters. KidTime
      # only ever reads it; leave these empty and the feature is absent everywhere.
      Dns__ApiUrl: ${KIDTIME_DNS_API_URL:-}
      Dns__ConsoleUrl: ${KIDTIME_DNS_CONSOLE_URL:-}
      Dns__Username: ${KIDTIME_DNS_USERNAME:-}
      Dns__Password: ${KIDTIME_DNS_PASSWORD:-}
      Dns__NodeId: ${KIDTIME_DNS_NODE_ID:-node1}
      Dns__GroupName: ${KIDTIME_DNS_GROUP:-}
      Dns__PinnedCertificateSha256: ${KIDTIME_DNS_CERT_PIN:-}
    volumes:
      # Absolute host paths so the stack behaves the same whether Portainer, a Git
      # checkout, or the Compose CLI decides the working directory.
      - ${KIDTIME_CERT_DIR:-/opt/kidtime/certs}:/https:ro
      - ${KIDTIME_RELEASE_DIR:-/opt/kidtime/releases}:/updates:ro
      - kidtime-dataprotection:/home/app/.aspnet/DataProtection-Keys
    ports:
      # Behind a reverse proxy, set KIDTIME_BIND=127.0.0.1 so only the proxy can reach
      # the container. On a plain LAN server the default exposes it to the network.
      - "${KIDTIME_BIND:-0.0.0.0}:${KIDTIME_SERVER_PORT:-5081}:8443"
    # Naming a second network drops the implicit default, and postgres and the panel are on
    # that one, so both are spelled out.
    networks: [default, dns]

  web:
    build:
      context: .
      dockerfile: src/kidtime-web/Dockerfile
      args:
        # Baked into the bundle by next build; empty serves the panel at the domain root.
        NEXT_PUBLIC_BASE_PATH: ${KIDTIME_BASE_PATH:-}
    restart: unless-stopped
    logging: *logging
    depends_on:
      - server
    environment:
      KIDTIME_API_URL: http://server:8080
      # The same three settings the server takes, spelled the way Node reads them, so one choice
      # in .env changes both halves of the stack at once.
      KIDTIME_LOG_FORMAT: ${KIDTIME_LOG_FORMAT:-pretty}
      KIDTIME_LOG_COLOR: ${KIDTIME_LOG_COLOR:-always}
      KIDTIME_LOG_LEVEL: ${KIDTIME_LOG_LEVEL:-info}
    ports:
      - "${KIDTIME_BIND:-0.0.0.0}:${KIDTIME_WEB_PORT:-3000}:3000"

volumes:
  kidtime-postgres:
  kidtime-dataprotection:

networks:
  # The DNS companion is usually a second stack on the same host, and reading it through the
  # household's public address means a local call leaving the machine, coming back through the
  # reverse proxy, and needing an admin port opened to the container - three things that can each
  # be closed without anybody connecting the silence to KidTime. Joining the companion's own
  # network keeps the read between two containers instead. KIDTIME_DNS_NETWORK names that network
  # and KIDTIME_DNS_EXTERNAL says it already exists; with neither set compose creates an ordinary
  # empty network here and nothing else changes, which is what keeps this opt-in for the
  # installations that run no DNS server at all. Reached that way the companion answers on its
  # container name, which its self-signed certificate matches no better than any other name -
  # that is what KIDTIME_DNS_CERT_PIN is for.
  dns:
    name: ${KIDTIME_DNS_NETWORK:-kidtime-dns}
    external: ${KIDTIME_DNS_EXTERNAL:-false}
