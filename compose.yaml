name: kidtime
services:
  postgres:
    image: postgres:18-alpine
    restart: "no"
    environment:
      POSTGRES_DB: kidtime
      POSTGRES_USER: kidtime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/initialize-server.ps1 first}
    volumes:
      - kidtime-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kidtime -d kidtime"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: src/KidTime.Server/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_HTTPS_PORTS: "8443"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/kidtime.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${KIDTIME_CERT_PASSWORD}
      ConnectionStrings__KidTime: Host=postgres;Port=5432;Database=kidtime;Username=kidtime;Password=${POSTGRES_PASSWORD}
      Jwt__SigningKey: ${KIDTIME_JWT_KEY}
      Admin__Email: ${KIDTIME_ADMIN_EMAIL}
      Admin__Password: ${KIDTIME_ADMIN_PASSWORD}
    volumes:
      - ./.data/certs:/https:ro
      - ./artifacts/releases:/updates:ro
      - kidtime-dataprotection:/home/app/.aspnet/DataProtection-Keys
    ports:
      - "5081:8443"

  web:
    build:
      context: .
      dockerfile: src/kidtime-web/Dockerfile
    restart: "no"
    depends_on:
      - server
    environment:
      KIDTIME_API_URL: http://server:8080
    ports:
      - "3000:3000"

volumes:
  kidtime-postgres:
  kidtime-dataprotection:
